name: Publish to npm

on:
  push:
    branches:
      - main

# 防止多个发布任务同时运行导致冲突
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  id-token: write    # 用于 Trusted Publishing (OIDC)
  contents: read     # 用于 checkout 代码

jobs:
  publish:
    runs-on: ubuntu-latest
    # 添加上下文环境保护（可选，用于审批流程）
    environment: npm-publish
    # 设置超时，防止长时间挂起
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # 减少安全风险：不保留 git 凭证
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c77e3389b08640e1ca663185e8473e152c4 # v4.1.1

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          # 使用 pnpm 缓存加速构建
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check-version.outputs.should_publish == 'true'
        # 使用 --frozen-lockfile 确保依赖一致性
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.check-version.outputs.should_publish == 'true'
        run: pnpm build

      - name: Publish to npm
        if: steps.check-version.outputs.should_publish == 'true'
        # --provenance 生成来源证明（Trusted Publishing 会自动生成，但显式声明更安全）
        run: npm publish --provenance --access public
        env:
          # 确保使用 Trusted Publishing 而不是遗留的 token
          NODE_AUTH_TOKEN: ''
